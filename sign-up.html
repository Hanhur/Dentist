<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sign-up.css">
    <title>Форма регистрации</title>
</head>
<body>
    <div class="register-container">
        <h2>Регистрация</h2>
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" placeholder="Введите имя">
                <div class="error-message" id="usernameError">Минимум 3 символа</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com">
                <div class="error-message" id="emailError">Введите корректный email</div>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Минимум 6 символов">
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="error-message" id="passwordError">Минимум 6 символов</div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль">
                <div class="error-message" id="confirmError">Пароли не совпадают</div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms" style="margin:0; font-weight: normal;">
                    Я согласен с <a href="#">условиями использования</a> и
                    <a href="#">политикой конфиденциальности</a>
                </label>
            </div>
            <div class="error-message" id="termsError" style="margin-top:-15px; margin-bottom:10px;">Необходимо согласие</div>
            <button type="submit">Зарегистрироваться</button>
            <div class="success-message" id="successMessage">✅ Регистрация успешно завершена!</div>
        </form>
        <div class="login-link">Уже есть аккаунт? <a href="#">Войти</a></div>
    </div>
    <script type="module" src="js/sign-up.js"></script>
</body>
</html>
